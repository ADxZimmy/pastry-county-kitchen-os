name: CI

# Runs on every push and pull request. Deliberately needs no production
# credentials: the live smoke family talks to real data and stays manual, so a
# pull request from anywhere can be checked without handing it secrets.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Restored 2026-08-17. This was `npm install` because the lockfile was
        # platform-skewed: it pinned @emnapi/* 1.10.0 nested under a rolldown
        # WASM binding while Linux resolved 1.11.2 hoisted, so npm ci refused it
        # as out of sync and the lockfile was never reproducible across
        # platforms.
        #
        # The skew was cleared as a side effect of the dependency bump in
        # 79b2248, which hoisted @emnapi/core and @emnapi/runtime to 1.11.3.
        # Verified before restoring, on both platforms rather than assumed:
        # npm ci installs cleanly on Linux (node 22 / npm 10.9.8, 248 packages)
        # and on Windows (node 24 / npm 11.9.0, 245 packages) — the count
        # differs only by platform-conditional optional dependencies — and the
        # full pipeline below passes on Linux from a clean checkout, emitting
        # byte-identical assets to the Windows build.
        #
        # Keeping npm ci here is the guard: if the lockfile ever drifts out of
        # sync with package.json again, this step fails loudly instead of npm
        # install quietly resolving around it.
        #
        # Note this no longer matches vercel.json's installCommand (npm install),
        # so CI proves the lockfile is exact while production still resolves at
        # build time.
        run: npm ci --no-audit --no-fund

      - name: Unit and policy tests
        run: npm test

      - name: Type check and build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Whitespace and conflict markers
        run: git diff --check

      - name: Contrast and legibility (WCAG AA)
        # Computed from the real CSS tokens, so a palette change that dims text
        # below AA fails a pull request instead of shipping.
        run: npm run a11y:contrast

      - name: Client bundle budget
        # PCO-011 budget: the compressed entry bundle must stay under 150 kB.
        # Enforced here so a regression fails a pull request instead of being
        # noticed in production later.
        run: node scripts/check-bundle-budget.mjs
