name: CI

# Runs on every push and pull request. Deliberately needs no production
# credentials: the live smoke family talks to real data and stays manual, so a
# pull request from anywhere can be checked without handing it secrets.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` cannot run here: the committed lockfile was generated on
        # Windows and resolves @emnapi/* 1.10.0 nested under a rolldown WASM
        # binding, while Linux resolves 1.11.2 hoisted, so npm refuses it as
        # out of sync. The lockfile is platform-skewed, which means npm ci was
        # never actually reproducible across platforms.
        #
        # `npm install` also matches how Vercel builds this project
        # (installCommand in vercel.json), so CI now exercises the same
        # resolution production gets. Restoring npm ci needs a lockfile
        # regenerated on Linux.
        run: npm install --no-audit --no-fund

      - name: Unit and policy tests
        run: npm test

      - name: Type check and build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Whitespace and conflict markers
        run: git diff --check

      - name: Contrast and legibility (WCAG AA)
        # Computed from the real CSS tokens, so a palette change that dims text
        # below AA fails a pull request instead of shipping.
        run: npm run a11y:contrast

      - name: Client bundle budget
        # PCO-011 budget: the compressed entry bundle must stay under 150 kB.
        # Enforced here so a regression fails a pull request instead of being
        # noticed in production later.
        run: node scripts/check-bundle-budget.mjs
